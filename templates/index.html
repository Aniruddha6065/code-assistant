<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programming Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-container {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 20px;
        }
        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
        }
        .user-message {
            background-color: #e9f7fe;
            margin-left: 20px;
        }
        .assistant-message {
            background-color: #f0f0f0;
            margin-right: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">Programming Assistant</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    {% if current_user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('history') }}">History</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('login') }}">Login</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('register') }}">Register</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% if current_user.is_authenticated %}
            <div class="row">
                <div class="col-md-8 mx-auto">
                    <div class="chat-container" id="chatContainer">
                        <!-- Messages will be displayed here -->
                    </div>
                    
                    <form id="chatForm">
                        <div class="mb-3">
                            <select class="form-select" id="language" required>
                                <option value="">Select a language</option>
                                <option value="python">Python</option>
                                <option value="javascript">JavaScript</option>
                                <option value="java">Java</option>
                                <option value="c++">C++</option>
                                <option value="ruby">Ruby</option>
                                <option value="go">Go</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control" id="question" rows="3" placeholder="Ask your programming question..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Send</button>
                    </form>
                </div>
            </div>
        {% else %}
            <div class="text-center">
                <h1>Welcome to Programming Assistant</h1>
                <p class="lead">Please <a href="{{ url_for('login') }}">login</a> or <a href="{{ url_for('register') }}">register</a> to start asking questions.</p>
            </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('chatForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const language = document.getElementById('language').value;
            const question = document.getElementById('question').value;
            
            if (!language || !question) {
                alert('Please select a language and enter your question');
                return;
            }
            
            // Add user message to chat
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML += `
                <div class="message user-message">
                    <strong>You (${language}):</strong><br>
                    ${question}
                </div>
            `;
            
            try {
                const response = await fetch('/api/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ language, question })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    chatContainer.innerHTML += `
                        <div class="message assistant-message">
                            <strong>Assistant:</strong><br>
                            ${data.response}
                        </div>
                    `;
                } else {
                    chatContainer.innerHTML += `
                        <div class="message assistant-message text-danger">
                            <strong>Error:</strong><br>
                            ${data.error}
                        </div>
                    `;
                }
            } catch (error) {
                chatContainer.innerHTML += `
                    <div class="message assistant-message text-danger">
                        <strong>Error:</strong><br>
                        An error occurred while processing your request.
                    </div>
                `;
            }
            
            // Clear the question input
            document.getElementById('question').value = '';
            
            // Scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });
    </script>
</body>
</html>
